<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    <title>Emilly Raissa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: rgb(235, 239, 240);
        cursor: pointer;
        text-align: center;
        font-family: Georgia, 'Times New Roman', Times, serif;
        min-height: 100vh;
        background-image: url("assets/foto3.png.jpeg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }

    img {
        margin: 50px;
        height: 120px;
        width: 120px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 20px;
        box-shadow: 0 3px 10px #000000a9;
    }

    h1 {
        color: rgb(7, 70, 36);
        margin-bottom: 10px;

    }

    p {
        color: #154f62;
        margin-bottom: 30px;
    }

    .redes {
        list-style: none;


    }

    .redes li {
        margin-bottom: 20px;
    }

    .redes a {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 15px;
        background-color: #76bdd1;
        text-decoration: none;
        border-radius: 80px;
        box-shadow: 0 3px 10px #000000a9;
        width: 40%;
        margin: 0 auto;
    }

    .redes i {
        font-size: 20px;
    }

    span,
    i {
        color: #346047;
    }
</style>

<body>
    <main class="perfil">
        <img src="assets/img.png.jpeg" alt="foto">
        <h1>Emilly Raissa</h1>
        <p>desenvolvedora em formação</p>
        <nav>
            <ul class="redes">
                <li>
                    <a href="https://www.instagram.com/emil_rayy/">
                        <span>instagram</span>
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                </li>
                <li>
                    <a href="https://www.linkedin.com/in/emilly-raissa-a02227376/">
                        <span> linkedln</span>
                        <i class="fa-brands fa-linkedin"></i>
                    </a>
                </li>
                <li>
                    <a href="https://github.com/emillyraissa-coder">
                        <span>git hub</span>
                        <i class="fa-brands fa-github"></i>
                    </a>
                </li>

            </ul>
        </nav>
    </main>
</body>

</html>
